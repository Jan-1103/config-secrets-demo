# Database user/password are read from the Secret "app-secrets" (created with kubectl, NOT stored in git)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: config-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: app-config, key: DB_NAME }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}   # simple for this demo (data is lost if the pod is deleted)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: config-demo
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
