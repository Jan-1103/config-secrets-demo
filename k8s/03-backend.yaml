apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: config-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: jananiparthasarathy/config-backend:1.0
          ports:
            - containerPort: 3000
          # ALL ConfigMap keys become environment variables
          envFrom:
            - configMapRef:
                name: app-config
          # Secret keys are injected one by one
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: DB_PASSWORD }
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: API_KEY }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: config-demo
spec:
  selector: { app: backend }
  ports:
    - port: 3000
      targetPort: 3000
