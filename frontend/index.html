<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Config & Secrets Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; }
    button { padding: 8px 14px; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Configuration &amp; Secrets Demo</h1>
  <button onclick="load('/api/config','cfg')">Show ConfigMap + Secret status</button>
  <button onclick="load('/api/db','db')">Test DB (uses Secret)</button>
  <h3>Config result</h3><pre id="cfg">click the button</pre>
  <h3>Database result</h3><pre id="db">click the button</pre>
  <script>
    async function load(url, id) {
      const r = await fetch(url);
      document.getElementById(id).textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
